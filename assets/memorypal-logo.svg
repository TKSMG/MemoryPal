<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MemoryPal Logo</title>
  <desc id="desc">A rounded blue tile with a white lowercase "m" drawn as one line of two arches, and an amber dot at the top right for a recalled idea.</desc>
  <!-- Geometry matches latest_app/memorypal/icon.py (LOGO_* constants) on a 1024 grid. -->
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d64f2"/>
      <stop offset="1" stop-color="#2a40c4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230.4" fill="url(#mp-bg)"/>
  <path d="M276.5 727.0 V440.3 A117.8 117.8 0 0 1 512.0 440.3 A117.8 117.8 0 0 1 747.5 440.3 V727.0 M512.0 440.3 V727.0"
        fill="none" stroke="#ffffff" stroke-width="117.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="793.6" cy="240.6" r="67.6" fill="#ffb020"/>
</svg>
