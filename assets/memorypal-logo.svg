  <title id="title">MemoryPal Logo</title>
  <desc id="desc">A rounded green tile holding a white study card. The card's top-right corner is turned over in amber, and a green lowercase "m" of two arches sits on the card.</desc>
  <!-- Geometry matches latest_app/memorypal/icon.py (LOGO_* constants) on a 1024 grid. -->
