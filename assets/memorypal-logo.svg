<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">MemoryPal Logo</title>
  <desc id="desc">A rounded blue-to-violet tile with a white connected "memory path" M, mint and amber recall nodes where the path turns, and a small spark for a remembered idea.</desc>
  <!-- Geometry matches latest_app/memorypal/icon.py (LOGO_* constants) on a 1024 grid. -->
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset="0.5" stop-color="#4a6cf7"/>
      <stop offset="1" stop-color="#6b3fe0"/>
    </linearGradient>
    <radialGradient id="mp-light" cx="184" cy="102" r="768" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="mp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#1a1450" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230.4" fill="url(#mp-bg)"/>
  <rect width="1024" height="1024" rx="230.4" fill="url(#mp-light)"/>
  <path d="M834.6 138.2 L845.1 178.9 L885.8 189.4 L845.1 200.0 L834.6 240.6 L824.0 200.0 L783.4 189.4 L824.0 178.9 Z" fill="#fff4c7"/>
  <g filter="url(#mp-shadow)">
    <path d="M271.4 747.5 L271.4 337.9 L512.0 614.4 L752.6 337.9 L752.6 747.5" fill="none" stroke="#ffffff" stroke-width="110.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="271.4" cy="337.9" r="80.9" fill="#ffffff"/>
    <circle cx="512.0" cy="614.4" r="80.9" fill="#ffffff"/>
    <circle cx="752.6" cy="337.9" r="80.9" fill="#ffffff"/>
  </g>
  <circle cx="271.4" cy="337.9" r="37.9" fill="#3ee6b4"/>
  <circle cx="512.0" cy="614.4" r="37.9" fill="#ffc24b"/>
  <circle cx="752.6" cy="337.9" r="37.9" fill="#3ee6b4"/>
</svg>
