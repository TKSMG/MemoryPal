name: Page review screenshots

# Screenshots every desktop page (scrolled), each dropdown opened and each
# dialog on a real Windows machine (tools/render_check/page_review.py), and
# commits them to page-review-output/ on the same branch.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-thread-gfw13o
    paths:
      - tools/render_check/page_review.py
      - .github/workflows/page-review.yml

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install platformdirs pypdf Pillow
      - name: Use a 1920x1080 screen
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Placeholder Google client (so Settings looks like the installed app)
        shell: bash
        run: printf 'CLIENT_ID = "screenshot-only.apps.googleusercontent.com"\nCLIENT_SECRET = "screenshot-only"\n' > latest_app/memorypal/google_client.py
      - name: Take the screenshots
        run: python tools/render_check/page_review.py page-review-output/desktop dark light
      - name: Commit them to the branch
        shell: bash
        run: |
          rm latest_app/memorypal/google_client.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add page-review-output
          git commit -q -m "Page review screenshots from ${GITHUB_SHA::7}"
          git push origin HEAD:${GITHUB_REF_NAME}
