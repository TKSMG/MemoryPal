name: Build Phone Apps

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # With an upload key in the repository secrets, the APK and the Play Store
      # bundle are signed with it. Without one, the APK keeps the debug signature,
      # which installs on any phone but can't go to Google Play.
      - name: Build and sign with the upload key
        if: ${{ env.HAS_UPLOAD_KEY == 'true' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Collect files
        run: |
          mkdir -p ../release
          cp android/app/build/outputs/apk/release/app-release.apk ../release/MemoryPal-Android.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab ../release/MemoryPal-Android-PlayStore.aab
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v5
        with:
          name: MemoryPal-Android
          retention-days: 30
          path: release/*

  build-ios:
    name: Build iOS
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Expo SDK 57's native modules need the Swift compiler from Xcode 27.
      - name: Use the newest Xcode
        working-directory: .
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      # Apple only lets signed apps onto an iPhone. These builds are unsigned:
      # the simulator app runs in Xcode's simulator, and the .ipa can be signed
      # and installed with a sideloading tool or turned into a TestFlight build
      # once an Apple Developer account is set up (see installers/README.md).
      - name: Build for the iOS simulator
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace MemoryPal.xcworkspace -scheme MemoryPal -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/sim.log" 2>&1 \
            || { grep -E "error:|BUILD FAILED|requires|not installed" "$RUNNER_TEMP/sim.log" | sort -u | head -30 | sed 's/^/::error::/'; tail -80 "$RUNNER_TEMP/sim.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/sim.log"

      - name: Build for iPhone and iPad (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace MemoryPal.xcworkspace -scheme MemoryPal -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/device.log" 2>&1 \
            || { grep -E "error:|BUILD FAILED|requires|not installed" "$RUNNER_TEMP/device.log" | sort -u | head -30 | sed 's/^/::error::/'; tail -80 "$RUNNER_TEMP/device.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/device.log"

      - name: Collect files
        run: |
          mkdir -p ../release "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/device/Build/Products/Release-iphoneos/MemoryPal.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/release/MemoryPal-iOS-unsigned.ipa" Payload)
          (cd "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator" && zip -qry "$GITHUB_WORKSPACE/release/MemoryPal-iOS-Simulator.zip" MemoryPal.app)

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: MemoryPal-iOS
          retention-days: 30
          path: release/*
