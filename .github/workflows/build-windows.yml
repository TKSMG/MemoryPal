name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Check Tkinter
        run: python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.destroy(); print('Tkinter is available')"

      - name: Run unit tests
        run: python -m unittest discover -s latest_app/tests

      - name: Build MemoryPal
        shell: cmd
        run: build_windows.cmd

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: build_installer_windows.cmd

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: MemoryPal-Windows
          retention-days: 30
          path: |
            release/MemoryPal/**
            release/MemoryPalSetup.exe
