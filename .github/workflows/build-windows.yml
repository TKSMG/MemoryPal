name: Build Windows App

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Check Tkinter
        run: python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.destroy(); print('Tkinter is available')"

      - name: Run unit tests
        shell: bash
        run: |
          # On failure the end of the test output becomes an annotation, so it
          # can be read from the checks page without downloading logs.
          if ! python -m unittest discover -s latest_app/tests > "$RUNNER_TEMP/tests.log" 2>&1; then
            tail -c 3500 "$RUNNER_TEMP/tests.log" | python -c "import sys; print('::error title=Unit tests::' + sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
            cat "$RUNNER_TEMP/tests.log"
            exit 1
          fi
          tail -3 "$RUNNER_TEMP/tests.log"

      - name: Build MemoryPal
        shell: cmd
        run: build_windows.cmd

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: build_installer_windows.cmd

      - name: Build Microsoft Store package
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: python tools/msix/make_msix.py release/MemoryPal release/MemoryPal-Windows-Store.msix

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: MemoryPal-Windows
          retention-days: 30
          path: |
            release/MemoryPal/**
            release/MemoryPalSetup.exe
            release/MemoryPal-Windows-Store.msix
