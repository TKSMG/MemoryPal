name: Store screenshots

# Takes Microsoft Store screenshots of the Windows app
# (tools/render_check/store_screenshots.py) and pushes them to the
# store-screenshots-output branch, so they can be fetched with git.
on:
  workflow_dispatch:
  push:
    branches:
      - ms-store-screenshots
    paths:
      - tools/render_check/store_screenshots.py
      - .github/workflows/store-screenshots.yml

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install platformdirs pypdf Pillow

      - name: Use a 1920x1080 screen
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Take the screenshots
        run: python tools/render_check/store_screenshots.py store-shots 1600x900

      - name: Push them to the output branch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out/microsoft"
          cp store-shots/*.png "$RUNNER_TEMP/out/microsoft/"
          cd "$RUNNER_TEMP/out"
          git init -q -b store-screenshots-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Microsoft Store screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" store-screenshots-output
          ls -l microsoft
