name: Check Phone App

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and parity tests
        run: npm test -- --ci

      - name: Bundle for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir dist
