name: Scroll probe

# Run by hand (Actions > Scroll probe > Run workflow) after changing how
# pages scroll, resize or switch: it measures start and page-open times,
# frame pacing, torn frames and flashes on real Windows and Mac machines and
# writes the numbers as a notice on the run. "compare" also measures main, side by side.
on:
  workflow_dispatch:
    inputs:
      compare:
        description: "Also measure main"
        type: boolean
        default: false
      render:
        description: "Only these render scenarios (name starts, space separated)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, variant: branch}
          - {os: macos-latest, variant: branch}
          - {os: windows-latest, variant: main, compare: true}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: ${{ !matrix.compare || inputs.compare }}
      - name: Use main's app with this branch's probes
        if: ${{ matrix.variant == 'main' && inputs.compare }}
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- latest_app
      - uses: actions/setup-python@v6
        if: ${{ !matrix.compare || inputs.compare }}
        with:
          python-version: "3.12"
      - name: Install app packages
        if: ${{ !matrix.compare || inputs.compare }}
        run: python -m pip install platformdirs pypdf Pillow
      - name: Measure scroll pacing and page changes
        if: ${{ !matrix.compare || inputs.compare }}
        shell: bash
        run: |
          mkdir -p probe-out render-out
          if [ "${{ matrix.variant }}" = "branch" ]; then
            # Main's app on this same machine too: runners differ in speed.
            git fetch --depth=1 origin main && mkdir -p main_app && git archive FETCH_HEAD latest_app | tar -x -C main_app
            SPEED_PROFILE=1 python tools/render_check/speed_probe.py latest_app main_app/latest_app > probe.txt 2>&1 || true
          else
            python tools/render_check/speed_probe.py > probe.txt 2>&1 || true
          fi
          PROBE_OUT=probe-out python tools/render_check/scroll_probe.py stats settings library >> probe.txt 2>&1 || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            PRINT_PNG=1 python tools/render_check/render_probe.py render-out ${{ inputs.render }} > render.txt 2>&1 || true
            grep -v '^PNG \|^SERIES ' render.txt >> probe.txt || true
            grep '^PNG ' render.txt || true
          fi
          grep '^SERIES ' render.txt >> probe.txt 2>/dev/null || true
          cat probe.txt
          python -c "import sys; t=open('probe.txt').read()[-3900:]; print('::notice title=Scroll probe ${{ matrix.os }} ${{ matrix.variant }}::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
      - uses: actions/upload-artifact@v5
        if: ${{ always() && (!matrix.compare || inputs.compare) }}
        with:
          name: probe-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            probe.txt
            probe-out/
            render-out/*.png
