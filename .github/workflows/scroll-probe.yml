name: Scroll probe

# Run by hand (Actions > Scroll probe > Run workflow) after changing how
# pages scroll, resize or switch: it measures start and page-open times,
# frame pacing, torn frames and flashes on real Windows and Mac machines and
# writes the numbers as a notice on the run. "compare" also measures main, side by side.
on:
  workflow_dispatch:
    inputs:
      compare:
        description: "Also measure main"
        type: boolean
        default: false
      scroll:
        description: "Pages to scroll (space separated, or all)"
        type: string
        default: "stats settings library"
      render:
        description: "Only these render scenarios (name starts, space separated)"
        type: string
        default: ""
      profile:
        description: "Profile these render scenarios (exact names, space separated)"
        type: string
        default: ""

      listen:
        description: "Only check talk-back listening (Windows)"
        type: boolean
        default: false
      selection:
        description: "Only drag-select text with the real mouse (selection_probe.py)"
        type: boolean
        default: false
      resize_modes:
        description: "Only compare the three window resize modes (edge and corner drags, Windows)"
        type: boolean
        default: false
      modes:
        description: "Which resize modes (with resize_modes); mode:VAR=1,VAR2=1 sets environment switches for that run"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  selection:
    if: ${{ inputs.selection }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install app packages
        run: python -m pip install platformdirs pypdf Pillow
      - name: Drag-select text
        shell: bash
        run: |
          python tools/render_check/selection_probe.py review dashboard > selection.txt 2>&1 || true
          cat selection.txt
          python -c "import sys; t=open('selection.txt').read()[-3900:]; print('::notice title=Selection probe windows::' + t.replace('%','%25').replace('\\r','').replace('\\n','%0A'))"

  listen:
    if: ${{ inputs.listen }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hear spoken answers from sound files
        run: python tools/listen_check/listen_check.py

  resize-modes:
    if: ${{ inputs.resize_modes }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install app packages
        run: python -m pip install platformdirs pypdf Pillow
      - name: Drag edges in each resize mode
        shell: bash
        run: |
          : > modes.txt
          for spec in ${{ inputs.modes || 'reveal buffered follow' }}; do
            mode="${spec%%:*}"
            switches=""
            [ "$spec" != "$mode" ] && switches="${spec#*:}"
            tag=$(echo "$spec" | tr ':=,' '-__')
            mkdir -p "render-$tag"
            env $(echo "$switches" | tr ',' ' ') PROFILE_SCENARIOS="${{ inputs.profile }}" MEMORYPAL_RESIZE_MODE=$mode WHOLE_SCREEN=1 python tools/render_check/render_probe.py "render-$tag" drag_setup2 drag_resize_grow drag_resize_shrink drag_resize_bottom_grow drag_resize_left zz_control_drag > "render-$tag.txt" 2>&1 || true
            grep -v '^PNG \|^SERIES \|^PROF ' "render-$tag.txt" | sed "s/^/$tag /" >> modes.txt || true
          done
          cat modes.txt
          python -c "import sys; t=open('modes.txt').read()[-3900:]; print('::notice title=Resize modes::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resize-modes
          path: |
            modes.txt
            render-*/*.png

  probe:
    if: ${{ !inputs.listen && !inputs.selection && !inputs.resize_modes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, variant: branch}
          - {os: macos-latest, variant: branch}
          - {os: windows-latest, variant: main, compare: true}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: ${{ !matrix.compare || inputs.compare }}
      - name: Use main's app with this branch's probes
        if: ${{ matrix.variant == 'main' && inputs.compare }}
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- latest_app
      - uses: actions/setup-python@v7
        if: ${{ !matrix.compare || inputs.compare }}
        with:
          python-version: "3.12"
      - name: Install app packages
        if: ${{ !matrix.compare || inputs.compare }}
        run: python -m pip install platformdirs pypdf Pillow
      - name: Measure scroll pacing and page changes
        if: ${{ !matrix.compare || inputs.compare }}
        shell: bash
        run: |
          mkdir -p probe-out render-out
          if [ "${{ matrix.variant }}" = "branch" ]; then
            # Main's app on this same machine too: runners differ in speed.
            git fetch --depth=1 origin main && mkdir -p main_app && git archive FETCH_HEAD latest_app | tar -x -C main_app
            SPEED_PROFILE=1 python tools/render_check/speed_probe.py latest_app main_app/latest_app > probe.txt 2>&1 || true
          else
            python tools/render_check/speed_probe.py > probe.txt 2>&1 || true
          fi
          PROBE_OUT=probe-out python tools/render_check/scroll_probe.py ${{ inputs.scroll || 'stats settings library' }} >> probe.txt 2>&1 || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            PROFILE_SCENARIOS="${{ inputs.profile }}" WHOLE_SCREEN=1 PRINT_PNG=1 python tools/render_check/render_probe.py render-out ${{ inputs.render }} > render.txt 2>&1 || true
            grep -v '^PNG \|^SERIES ' render.txt >> probe.txt || true
            grep '^PNG ' render.txt || true
          fi
          grep '^SERIES ' render.txt >> probe.txt 2>/dev/null || true
          cat probe.txt
          python -c "import sys; t=open('probe.txt').read()[-3900:]; print('::notice title=Scroll probe ${{ matrix.os }} ${{ matrix.variant }}::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
      - uses: actions/upload-artifact@v7
        if: ${{ always() && (!matrix.compare || inputs.compare) }}
        with:
          name: probe-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            probe.txt
            probe-out/
            render-out/*.png
