name: Supabase keep-alive

# Supabase's free plan pauses a project that shows "low activity" over a week;
# its docs say "a few user requests to the database each day" is enough.
# Pinging every 3 days with requests the database refused did NOT count: the
# project paused anyway on ~2026-11-21. So this now runs four times a day and
# calls public.keepalive() (supabase/migrations/2026-11-21-keepalive.sql), a
# query the public key is allowed to run that returns the time and touches no
# data. The publishable key is the same public one the apps ship with. The run
# fails (and GitHub emails you) if the project doesn't answer, for example
# because it was paused anyway.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://wgfaryxbwritolayuydh.supabase.co
      SUPABASE_KEY: sb_publishable_2dZ7rq2PQ9oCMG7bMMWhUQ_am1Zh1E6
    steps:
      - name: Ping the database and sign-in service
        run: |
          set -u
          ok=1
          # A query that succeeds, so it counts as database activity.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --retry 3 --retry-delay 10 \
            -X POST -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{}' "$SUPABASE_URL/rest/v1/rpc/keepalive" || echo 000)
          echo "rpc/keepalive -> HTTP $code"
          head -c 300 /tmp/body 2>/dev/null; echo
          case "$code" in 2??) ;; *) ok=0 ;; esac
          # The sign-in service too.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/auth/v1/health" || echo 000)
          echo "auth/v1/health -> HTTP $code"
          case "$code" in 2??|401|403) ;; *) ok=0 ;; esac
          if [ "$ok" != 1 ]; then
            echo "::error::Supabase didn't answer. It may be paused: open https://supabase.com/dashboard/project/wgfaryxbwritolayuydh and press Restore."
            exit 1
          fi
