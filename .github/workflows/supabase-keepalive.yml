name: Supabase keep-alive

# Supabase's free plan pauses a project after about a week with no activity.
# This asks the database for one row every 3 days so it never goes idle.
# The publishable key is the same public one the apps ship with, and it can't
# read anyone's data: the request is refused by the database, which still
# counts as activity. The run fails (and GitHub emails you) if the project
# doesn't answer, for example because it was paused anyway.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://wgfaryxbwritolayuydh.supabase.co
      SUPABASE_KEY: sb_publishable_2dZ7rq2PQ9oCMG7bMMWhUQ_am1Zh1E6
    steps:
      - name: Ping the database and sign-in service
        run: |
          set -u
          ok=1
          for path in "rest/v1/sync_records?select=key&limit=1" "auth/v1/health"; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --retry 3 --retry-delay 10 \
              -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/$path" || echo 000)
            echo "$path -> HTTP $code"
            head -c 300 /tmp/body 2>/dev/null; echo
            # 2xx, or 401/403 from the database refusing the public key, means it is awake.
            case "$code" in
              2??|401|403) ;;
              *) ok=0 ;;
            esac
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Supabase didn't answer. It may be paused: open https://supabase.com/dashboard/project/wgfaryxbwritolayuydh and press Restore."
            exit 1
          fi
