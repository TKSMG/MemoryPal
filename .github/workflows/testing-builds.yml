name: Testing Builds

# Builds every app from the `testing` branch (main plus all unmerged work, see
# docs/TESTING_BRANCH.md) and puts the installers on one pre-release named
# "testing-build", replaced on every push. Pre-releases never count as the
# latest release, so releases/latest/download links still point at the real one.
on:
  workflow_dispatch:
  push:
    branches:
      - testing

permissions:
  contents: read

# A newer push makes an older, still-running build pointless.
concurrency:
  group: testing-builds
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
  macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit
  mobile:
    uses: ./.github/workflows/build-mobile.yml
    secrets: inherit

  publish:
    name: Publish testing build
    needs: [windows, macos, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every build
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Gather the installers
        run: |
          mkdir -p out
          cp artifacts/MemoryPal-Windows/MemoryPalSetup.exe out/MemoryPal-Windows-Setup.exe
          cp artifacts/MemoryPal-macOS-AppleSilicon/*.dmg out/
          cp artifacts/MemoryPal-macOS-Intel/*.dmg out/
          cp artifacts/MemoryPal-Android/MemoryPal-Android.apk out/
          (cd out && shasum -a 256 * > SHA256SUMS.txt)
          ls -l out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: testing-build
        run: |
          short="${GITHUB_SHA::7}"
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Testing build ($short)" \
            --notes-file <(printf 'For testing only, not for the stores. Built from the testing branch at %s on %s.\n\nWhat is in it: see docs/TESTING_BRANCH.md on the testing branch.\n' "$short" "$(date -u '+%Y-%m-%d %H:%M UTC')")
