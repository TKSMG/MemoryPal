name: Something isn't working
description: Tell us about a bug or a problem in MemoryPal.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to tell us. Please don't include passwords, emailed codes or private notes.
  - type: dropdown
    id: device
    attributes:
      label: Where did it happen?
      options:
        - iPhone or iPad
        - Android phone or tablet
        - Windows (Microsoft Store)
        - Windows (download from GitHub)
        - Mac
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MemoryPal version
      description: The bottom of Settings shows it on the phone; on the computer, Settings → Storage and backups.
      placeholder: "0.53.6"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
