version: "3"

tasks:
  clean:
    desc: Remove local MemoryPal build output, caches, and temp build leftovers
    cmds:
      - ./clean_build_artifacts.cmd

  windows:
    desc: Build the Windows MemoryPal app folder with the stable PyInstaller path
    generates:
      - release/MemoryPal/MemoryPal.exe
    cmds:
      - ./build_windows.cmd

  windows-installer:
    desc: Build the Windows app folder and Inno Setup installer
    deps:
      - windows
    generates:
      - release/MemoryPalSetup.exe
    cmds:
      - ./build_installer_windows.cmd
